name: FieldPilot Reference First Candidate
on:
  push:
    branches: ['worker/fieldpilot-reference-first-01']
    paths: ['integrations/fieldpilot-reference-first-01/**', '.github/workflows/fieldpilot-reference-first-01.yml']
  pull_request:
    branches: ['worker/fieldpilot-report-actionability-01']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fieldpilot-reference-first-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/worker/fieldpilot-reference-first-01'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: skills/fieldpilot/tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pinned additive trial
        run: python integrations/fieldpilot-reference-first-01/apply_patch.py --skill-root skills/fieldpilot
      - name: Validate YAML, existing source preservation and idempotence
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, yaml
          base='3e6a66b6c5f44eb84b49509d899114f0e0587e14'
          root=Path('skills/fieldpilot')
          old=subprocess.check_output(['git','show',base+':skills/fieldpilot/SKILL.md']).decode()
          current=(root/'SKILL.md').read_text()
          kernel=lambda s:s.split('## ALWAYS-LOADED INVARIANT KERNEL',1)[1].split('## STEP 0',1)[0]
          assert kernel(old)==kernel(current)
          meta=yaml.safe_load(current.split('---',2)[1])
          assert len(meta['description'])<=1024
          assert meta['metadata']['reference_extension_revision']=='reference-first-01'
          allowed={'skills/fieldpilot/SKILL.md','skills/fieldpilot/references/modules/BROKER_RESEARCH_DELIVERY.md'}
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',base,'--','skills/fieldpilot']).decode().splitlines()
          preserved=0
          for p in paths:
              if p in allowed or '__pycache__' in p or p.endswith('.pyc'): continue
              assert Path(p).read_bytes()==subprocess.check_output(['git','show',base+':'+p]),p
              preserved+=1
          hashes=lambda:{p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts}
          before=hashes()
          subprocess.run(['python','integrations/fieldpilot-reference-first-01/apply_patch.py','--skill-root',str(root)],check=True)
          assert before==hashes()
          print('YAML_AND_19_INVARIANTS_AND_IDEMPOTENCE_PASS; PRESERVED',preserved)
          PY
      - name: Run inherited and new instruction checks
        run: python -m unittest discover -s skills/fieldpilot/tests -p 'test_*_contract.py' -v
      - name: Publish only to the isolated candidate branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/worker/fieldpilot-reference-first-01'
        run: |
          git add skills/fieldpilot/SKILL.md skills/fieldpilot/references/modules/BROKER_RESEARCH_DELIVERY.md skills/fieldpilot/references/modules/REFERENCE_FIRST_VALUE.md skills/fieldpilot/tests/test_reference_first_contract.py skills/fieldpilot/tests/reference_first/README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(fieldpilot): materialize checked reference-first value candidate'
            git push origin HEAD:worker/fieldpilot-reference-first-01
          fi
          git rev-parse HEAD
      - name: Package tested source without caches
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,zipfile
          root=Path('skills/fieldpilot'); out=Path(os.environ['RUNNER_TEMP'])/'delivery';out.mkdir()
          files=sorted(p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          hashes={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          with zipfile.ZipFile(out/'FieldPilot_reference_first_01_TRIAL.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  info=zipfile.ZipInfo('fieldpilot/'+p.relative_to(root).as_posix(),date_time=(2026,9,28,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16
                  z.writestr(info,p.read_bytes())
          m={'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'file_count':len(files),'sha256':hashes,'behavioral_tests':'NOT_RUN'}
          (out/'MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          print('FILES',len(files))
          print('ZIP_SHA256',hashlib.sha256((out/'FieldPilot_reference_first_01_TRIAL.zip').read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fieldpilot-reference-first-${{ github.sha }}
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 14
