name: FieldPilot Report Actionability Candidate
on:
  push:
    branches: ['worker/fieldpilot-report-actionability-01']
  pull_request:
    branches: ['worker/fieldpilot-agent-reach-readiness-02']
    paths:
      - 'skills/fieldpilot/**'
      - 'integrations/fieldpilot-report-actionability-01/**'
      - '.github/workflows/fieldpilot-report-actionability-01.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fieldpilot-report-actionability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: skills/fieldpilot/tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded candidate delta
        run: python integrations/fieldpilot-report-actionability-01/apply_patch.py --skill-root skills/fieldpilot
      - name: Validate metadata and preservation
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python - <<'PY'
          import hashlib, subprocess, yaml
          from pathlib import Path
          p = Path('skills/fieldpilot/SKILL.md')
          base = subprocess.check_output(['git','show','1e8f00db1220fa2e37c10f9e7432ddc0a234763e:skills/fieldpilot/SKILL.md']).decode()
          current = p.read_text()
          kernel = lambda s:s.split('## ALWAYS-LOADED INVARIANT KERNEL',1)[1].split('## STEP 0',1)[0]
          assert kernel(base) == kernel(current)
          meta = yaml.safe_load(current.split('---',2)[1])
          assert meta['name'] == 'fieldpilot'
          assert len(meta['description']) <= 1024
          assert meta['metadata']['report_extension_revision'] == 'report-actionability-01'
          before = hashlib.sha256(p.read_bytes()).hexdigest()
          subprocess.run(['python','integrations/fieldpilot-report-actionability-01/apply_patch.py','--skill-root','skills/fieldpilot'],check=True)
          assert before == hashlib.sha256(p.read_bytes()).hexdigest()
          print('YAML_AND_19_INVARIANTS_AND_IDEMPOTENCE_PASS')
          PY
      - name: Run structural and declared-review tests
        run: python -m unittest discover -s skills/fieldpilot/tests -p 'test_*_contract.py' -v
      - name: Publish materialized files on isolated branch only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/worker/fieldpilot-report-actionability-01'
        run: |
          git add skills/fieldpilot/SKILL.md skills/fieldpilot/references/modules/BUYER_FACING_DECISION_REPORT.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(fieldpilot): wire tested outline-aware report synthesis'
            git push origin HEAD:worker/fieldpilot-report-actionability-01
          fi
          git rev-parse HEAD
      - name: Package actual tested skill without caches
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,zipfile
          root=Path('skills/fieldpilot'); out=Path(os.environ['RUNNER_TEMP'])/'delivery';out.mkdir()
          entries=sorted(p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc')
          hashes={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in entries}
          with zipfile.ZipFile(out/'FieldPilot_report_actionability_01_TRIAL.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in entries:z.write(p,'fieldpilot/'+p.relative_to(root).as_posix())
          manifest={'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'file_count':len(entries),'sha256':hashes,'behavioral_copilot_test':'NOT_RUN'}
          (out/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('FILES',len(entries))
          print('ZIP_SHA256',hashlib.sha256((out/'FieldPilot_report_actionability_01_TRIAL.zip').read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fieldpilot-report-actionability-${{ github.sha }}
          path: ${{ runner.temp }}/delivery/
          retention-days: 14
          if-no-files-found: error
