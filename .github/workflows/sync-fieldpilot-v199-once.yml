name: Sync FieldPilot v1.9.9-rc01 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-fieldpilot-v199-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical candidate package
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch worker/fieldpilot-v199-competitive-superiority01 \
            https://github.com/gimhyuna0221-art/fieldpilot-orca.git /tmp/fieldpilot-orca

      - name: Replace vault FieldPilot package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f skills/fieldpilot/CHANGELOG.md ]; then
            cp skills/fieldpilot/CHANGELOG.md /tmp/fieldpilot-old-changelog.md
          fi
          rm -rf skills/fieldpilot
          mkdir -p skills/fieldpilot
          cp -a /tmp/fieldpilot-orca/fieldpilot/. skills/fieldpilot/

          cat > /tmp/fieldpilot-changelog-head.md <<'EOF'
          # Changelog

          ## 1.9.9-rc01 — 2026-09-14

          - `fieldpilot-orca`의 최신 competitive-superiority 후보 패키지로 공개 vault의 구버전 FieldPilot을 교체함.
          - Source branch: `worker/fieldpilot-v199-competitive-superiority01`.
          - Source delivery head: `0c1454f483191757b1e7503b1ad4454352ff5296`.
          - Runtime/source candidate commit: `4a44d9379b6a0a0ea9606efb70093b6c0fcb9d42`.
          - Package version: `1.9.9-rc01`.
          - AI-first market research / Market→Build decision workflow, competitor recall safeguards, product-state honesty, commercial claim ceilings, decision continuity, sellability/product-pattern modules, and professional-report routes included.
          - Status remains **RC candidate**, not stable release: supported-host install/discovery/invocation/uninstall lifecycle C14 is still externally blocked/unverified. No superiority, PMF, WTP, sales, release, or stable-host claim is implied.
          - Full `fieldpilot/` package (references + tools) is synced rather than replacing `SKILL.md` alone, so relative module loads remain valid.

          ## Historical vault lineage (pre-1.9.x)

          The entries below describe the older field-pilot/fieldwork-oriented skill that previously occupied this path. They are retained only as history and do not describe the current runtime.

          EOF

          if [ -f /tmp/fieldpilot-old-changelog.md ]; then
            sed '1{/^# Changelog$/d;}' /tmp/fieldpilot-old-changelog.md >> /tmp/fieldpilot-changelog-head.md
          fi
          mv /tmp/fieldpilot-changelog-head.md skills/fieldpilot/CHANGELOG.md

      - name: Validate synced package
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'version: "1.9.9-rc01"' skills/fieldpilot/SKILL.md
          test -f skills/fieldpilot/references/modules/DECISION_CONTINUITY.md
          test -f skills/fieldpilot/references/modules/MARKET_FAVORED_PRODUCT_PATTERNS.md
          test -f skills/fieldpilot/references/modules/PRODUCT_READINESS_AND_SIGNAL_INTEGRITY.md
          test -f skills/fieldpilot/tools/efficiency_control.py
          test -f skills/fieldpilot/tools/render_report.py
          python -m py_compile skills/fieldpilot/tools/efficiency_control.py skills/fieldpilot/tools/render_report.py
          source_count="$(find /tmp/fieldpilot-orca/fieldpilot -type f | wc -l | tr -d ' ')"
          synced_without_changelog="$(find skills/fieldpilot -type f ! -name CHANGELOG.md | wc -l | tr -d ' ')"
          test "$source_count" = "$synced_without_changelog"
          echo "SOURCE_FILE_COUNT=$source_count"
          echo "VAULT_FILE_COUNT_WITH_CHANGELOG=$(find skills/fieldpilot -type f | wc -l | tr -d ' ')"

      - name: Commit synced package and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-fieldpilot-v199-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(fieldpilot): sync v1.9.9-rc01 candidate package"
          git push origin HEAD:main
