name: Rect Strip UV checks

on:
  push:
    paths:
      - 'skills/rect-strip-uv/**'
      - '.github/workflows/rect-strip-uv.yml'
      - 'AGENTS.md'
  pull_request:
    paths:
      - 'skills/rect-strip-uv/**'
      - '.github/workflows/rect-strip-uv.yml'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rect-strip-uv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/rect-strip-uv
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/rect-strip-uv/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all solver and test modules
        run: python -m compileall -q scripts tests examples
      - name: Inspect environment
        run: python scripts/rect_strip_uv.py doctor
      - name: Run original and dual-resolution regression tests
        run: python -m unittest discover -s tests -v
      - name: Generate small synthetic input
        run: python examples/make_example.py --output demo-input/strap.obj
      - name: End-to-end UV-only export and reload verification
        run: python scripts/rect_strip_uv.py run --input demo-input/strap.obj --work demo-job --also-01
      - name: Generate dense rounded synthetic input
        run: python examples/make_dense_example.py --output demo-input/dense.obj
      - name: End-to-end default auto high-poly and low-poly delivery
        run: python scripts/rect_strip_uv.py run --input demo-input/dense.obj --work dense-job
      - name: Assert actual dual-resolution artifacts and emit commit-bound receipt
        run: python tests/ci_receipt.py dense-job
      - name: Preserve synthetic QA and previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rect-strip-uv-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            skills/rect-strip-uv/demo-job/delivery/
            skills/rect-strip-uv/dense-job/delivery/
          if-no-files-found: warn
          retention-days: 7
