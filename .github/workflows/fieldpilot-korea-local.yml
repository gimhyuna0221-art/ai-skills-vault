name: FieldPilot Contract Tests

on:
  pull_request:
    paths:
      - 'skills/fieldpilot/**'
      - '.github/workflows/fieldpilot-korea-local.yml'
  push:
    branches:
      - 'fieldpilot/korea-local-coverage-rc02'
      - 'worker/fieldpilot-**'
    paths:
      - 'skills/fieldpilot/**'
      - '.github/workflows/fieldpilot-korea-local.yml'

permissions:
  contents: read

jobs:
  korea-local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run FieldPilot contract tests
        run: python -m unittest discover -s skills/fieldpilot/tests -p 'test_*_contract.py' -v
