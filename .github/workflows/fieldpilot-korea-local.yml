name: FieldPilot Korea Local Coverage

on:
  pull_request:
    paths:
      - 'skills/fieldpilot/**'
      - '.github/workflows/fieldpilot-korea-local.yml'
  push:
    branches:
      - 'fieldpilot/korea-local-coverage-rc02'
    paths:
      - 'skills/fieldpilot/**'
      - '.github/workflows/fieldpilot-korea-local.yml'

permissions:
  contents: read

jobs:
  korea-local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Korea-local coverage contract
        run: python -m unittest skills/fieldpilot/tests/test_korea_local_coverage_contract.py -v
